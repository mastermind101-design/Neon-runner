<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AURIONS UNLEASHED</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;

      background: #010912;

      font-family: Arial, Helvetica, sans-serif;

      color: white;
    }


    /* =========================
       GAME WORLD
    ========================= */

    #game {

      position: relative;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      background:

        radial-gradient(
          ellipse at 50% 15%,
          rgba(80, 210, 235, 0.45),
          transparent 30%
        ),

        radial-gradient(
          ellipse at 20% 75%,
          rgba(20, 120, 150, 0.22),
          transparent 35%
        ),

        linear-gradient(
          to bottom,
          #0a3446 0%,
          #075267 32%,
          #043445 65%,
          #011923 100%
        );

    }


    /* =========================
       LIGHT RAYS
    ========================= */

    .light-ray {

      position: absolute;

      top: -20%;

      width: 150px;
      height: 150%;

      background:

        linear-gradient(
          to bottom,
          rgba(220, 255, 255, 0.12),
          rgba(220, 255, 255, 0)
        );

      filter: blur(9px);

      pointer-events: none;

    }


    .ray1 {

      left: 12%;

      transform: rotate(12deg);

    }


    .ray2 {

      left: 58%;

      transform: rotate(-10deg);

    }


    .ray3 {

      left: 82%;

      transform: rotate(8deg);

      opacity: 0.5;

    }


    /* =========================
       TITLE
    ========================= */

    #title {

      position: absolute;

      top: 20px;

      left: 0;

      width: 100%;

      text-align: center;

      font-size: clamp(
        24px,
        7vw,
        44px
      );

      font-weight: 900;

      letter-spacing: 4px;

      color: #e7fcff;

      text-shadow:

        0 2px 0 #16465a,

        0 5px 12px
        rgba(0, 0, 0, 0.8),

        0 0 12px
        rgba(110, 240, 255, 1),

        0 0 30px
        rgba(40, 190, 255, 0.8);

      animation:
        titlePulse 3s
        ease-in-out infinite;

      z-index: 50;

    }


    @keyframes titlePulse {

      0%,
      100% {

        transform: scale(1);

      }

      50% {

        transform: scale(1.025);

      }

    }


    /* =========================
       HUD
    ========================= */

    #hud {

      position: absolute;

      top: 82px;

      left: 18px;

      z-index: 50;

      padding: 10px 14px;

      border-radius: 12px;

      background:
        rgba(0, 10, 18, 0.55);

      border:
        1px solid
        rgba(180, 245, 255, 0.22);

      backdrop-filter:
        blur(6px);

      font-size: 14px;

    }


    #score {

      color: #aef5ff;

      font-weight: bold;

    }


    #health {

      color: #8fffc0;

      font-weight: bold;

    }


    /* =========================
       PLAYER
    ========================= */

    #player {

      position: absolute;

      width: 52px;

      height: 52px;

      left: 50%;

      top: 55%;

      margin-left: -26px;

      margin-top: -26px;

      border-radius: 50%;

      background:

        radial-gradient(
          circle at 32% 25%,

          #ffffff 0%,

          #d8fcff 14%,

          #6de7ff 35%,

          #1b91bd 67%,

          #052d40 100%
        );

      border:
        2px solid
        rgba(210, 250, 255, 0.9);

      box-shadow:

        0 0 12px
        rgba(120, 240, 255, 1),

        0 0 28px
        rgba(45, 205, 255, 0.9),

        0 0 55px
        rgba(30, 150, 210, 0.6);

      z-index: 20;

    }


    #player::before {

      content: "";

      position: absolute;

      width: 78px;

      height: 78px;

      left: 50%;

      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      border:
        1px solid
        rgba(130, 245, 255, 0.5);

      box-shadow:

        0 0 18px
        rgba(80, 225, 255, 0.5),

        inset 0 0 18px
        rgba(80, 225, 255, 0.25);

      animation:
        aura 2s
        ease-in-out infinite;

      pointer-events: none;

    }


    @keyframes aura {

      0%,
      100% {

        transform:
          translate(-50%, -50%)
          scale(0.85);

        opacity: 0.3;

      }

      50% {

        transform:
          translate(-50%, -50%)
          scale(1.15);

        opacity: 0.85;

      }

    }


    /* =========================
       ENEMIES
    ========================= */

    .enemy {

      position: absolute;

      width: 42px;

      height: 42px;

      border-radius: 50%;

      background:

        radial-gradient(
          circle at 35% 30%,

          #ffffff 0%,

          #ffd7ff 12%,

          #ef73ff 35%,

          #8d2fa9 65%,

          #351040 100%
        );

      border:
        2px solid
        rgba(255, 220, 255, 0.8);

      box-shadow:

        0 0 12px
        rgba(255, 100, 255, 0.9),

        0 0 28px
        rgba(220, 50, 255, 0.65);

      z-index: 15;

      pointer-events: none;

    }


    .enemy::before {

      content: "";

      position: absolute;

      width: 58px;

      height: 58px;

      left: 50%;

      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      border:
        1px solid
        rgba(255, 100, 255, 0.35);

      animation:
        enemyAura 1.3s
        ease-in-out infinite;

    }


    @keyframes enemyAura {

      0%,
      100% {

        transform:
          translate(-50%, -50%)
          scale(0.8);

        opacity: 0.3;

      }

      50% {

        transform:
          translate(-50%, -50%)
          scale(1.15);

        opacity: 0.8;

      }

    }


    /* =========================
       JOYSTICK
    ========================= */

    #joystick {

      position: absolute;

      left: 25px;

      bottom: 28px;

      width: 120px;

      height: 120px;

      border-radius: 50%;

      background:

        radial-gradient(
          circle,

          rgba(100, 230, 255, 0.18),

          rgba(255, 255, 255, 0.035)
        );

      border:
        2px solid
        rgba(210, 250, 255, 0.35);

      box-shadow:

        inset 0 0 25px
        rgba(80, 220, 255, 0.12),

        0 0 20px
        rgba(40, 190, 220, 0.2);

      z-index: 60;

    }


    #stick {

      position: absolute;

      width: 54px;

      height: 54px;

      left: 31px;

      top: 31px;

      border-radius: 50%;

      background:

        radial-gradient(
          circle at 35% 30%,

          #ffffff,

          #7beaff 35%,

          #249ec4 80%
        );

      border:
        2px solid
        rgba(225, 255, 255, 0.7);

      box-shadow:

        0 0 18px
        rgba(90, 230, 255, 0.9),

        0 0 35px
        rgba(40, 190, 230, 0.5);

      z-index: 61;

    }


    /* =========================
       BUBBLES
    ========================= */

    .bubble {

      position: absolute;

      bottom: -30px;

      border-radius: 50%;

      border:
        1px solid
        rgba(225, 250, 255, 0.55);

      background:
        rgba(200, 250, 255, 0.05);

      pointer-events: none;

      animation:
        bubbleRise
        linear infinite;

    }


    @keyframes bubbleRise {

      0% {

        transform:
          translateY(0);

        opacity: 0;

      }

      15% {

        opacity: 0.75;

      }

      50% {

        transform:
          translateY(-50vh)
          translateX(25px);

      }

      100% {

        transform:
          translateY(-120vh)
          translateX(-20px);

        opacity: 0;

      }

    }


    .b1 {

      left: 8%;

      width: 7px;
      height: 7px;

      animation-duration: 7s;

    }


    .b2 {

      left: 22%;

      width: 12px;
      height: 12px;

      animation-duration: 9s;

      animation-delay: 2s;

    }


    .b3 {

      left: 43%;

      width: 6px;
      height: 6px;

      animation-duration: 6s;

      animation-delay: 1s;

    }


    .b4 {

      left: 64%;

      width: 14px;
      height: 14px;

      animation-duration: 10s;

      animation-delay: 3s;

    }


    .b5 {

      left: 84%;

      width: 8px;
      height: 8px;

      animation-duration: 8s;

      animation-delay: 1.5s;

    }


    /* =========================
       PARTICLES
    ========================= */

    .particle {

      position: absolute;

      width: 3px;

      height: 3px;

      border-radius: 50%;

      background:
        rgba(210, 250, 255, 0.55);

      pointer-events: none;

      animation:
        particleFloat
        linear infinite;

    }


    @keyframes particleFloat {

      from {

        transform:
          translateY(20px);

        opacity: 0;

      }

      20% {

        opacity: 0.8;

      }

      to {

        transform:
          translateY(-110vh);

        opacity: 0;

      }

    }


    /* =========================
       GAME OVER
    ========================= */

    #gameOver {

      position: absolute;

      inset: 0;

      display: none;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      background:
        rgba(0, 5, 10, 0.82);

      z-index: 100;

      text-align: center;

    }


    #gameOver h2 {

      font-size: 34px;

      letter-spacing: 3px;

      margin-bottom: 12px;

    }


    #restart {

      margin-top: 18px;

      padding: 12px 22px;

      border: 0;

      border-radius: 10px;

      background: #7beaff;

      color: #06202c;

      font-weight: bold;

      font-size: 16px;

    }

  </style>
</head>


<body>

  <div id="game">

    <div class="light-ray ray1"></div>
    <div class="light-ray ray2"></div>
    <div class="light-ray ray3"></div>


    <div id="title">
      AURIONS UNLEASHED
    </div>


    <div id="hud">

      ⭐ Score:
      <span id="score">0</span>

      <br>

      ❤️ Health:
      <span id="health">100</span>

    </div>


    <div id="player"></div>


    <div id="joystick">

      <div id="stick"></div>

    </div>


    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>
    <div class="bubble b5"></div>


    <div id="gameOver">

      <h2>
        AURION DOWN
      </h2>

      <div>
        Final Score:
        <span id="finalScore">0</span>
      </div>

      <button id="restart">
        PLAY AGAIN
      </button>

    </div>

  </div>


  <script>

    /* =========================
       GAME STATE
    ========================= */

    let score = 0;

    let health = 100;

    let playerX =
      window.innerWidth / 2;

    let playerY =
      window.innerHeight * 0.55;

    let joystickActive = false;

    let joystickX = 0;

    let joystickY = 0;

    let enemySpeed = 1.2;

    let gameRunning = true;


    /* =========================
       ELEMENTS
    ========================= */

    const game =
      document.getElementById("game");

    const player =
      document.getElementById("player");

    const joystick =
      document.getElementById("joystick");

    const stick =
      document.getElementById("stick");

    const scoreDisplay =
      document.getElementById("score");

    const healthDisplay =
      document.getElementById("health");

    const gameOverScreen =
      document.getElementById("gameOver");

    const finalScore =
      document.getElementById("finalScore");

    const restartButton =
      document.getElementById("restart");


    /* =========================
       PLAYER
    ========================= */

    function updatePlayer() {

      player.style.left =
        playerX + "px";

      player.style.top =
        playerY + "px";

    }


    /* =========================
       JOYSTICK
    ========================= */

    function moveJoystick(
      clientX,
      clientY
    ) {

      const rect =
        joystick.getBoundingClientRect();

      const centerX =
        rect.left +
        rect.width / 2;

      const centerY =
        rect.top +
        rect.height / 2;

      let dx =
        clientX - centerX;

      let dy =
        clientY - centerY;

      const maximum = 32;

      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      if (distance > maximum) {

        dx =
          (dx / distance) *
          maximum;

        dy =
          (dy / distance) *
          maximum;

      }


      joystickX =
        dx / maximum;

      joystickY =
        dy / maximum;


      stick.style.left =
        (31 + dx) + "px";

      stick.style.top =
        (31 + dy) + "px";

    }


    function resetJoystick() {

      joystickActive = false;

      joystickX = 0;

      joystickY = 0;

      stick.style.left = "31px";

      stick.style.top = "31px";

    }


    joystick.addEventListener(
      "pointerdown",
      function(event) {

        if (!gameRunning) return;

        joystickActive = true;

        joystick.setPointerCapture(
          event.pointerId
        );

        moveJoystick(
          event.clientX,
          event.clientY
        );

      }
    );


    joystick.addEventListener(
      "pointermove",
      function(event) {

        if (!joystickActive) return;

        moveJoystick(
          event.clientX,
          event.clientY
        );

      }
    );


    joystick.addEventListener(
      "pointerup",
      resetJoystick
    );


    joystick.addEventListener(
      "pointercancel",
      resetJoystick
    );


    /* =========================
       PLAYER MOVEMENT
    ========================= */

    function movePlayer() {

      if (!gameRunning) return;


      if (joystickActive) {

        const speed = 5;

        playerX +=
          joystickX * speed;

        playerY +=
          joystickY * speed;

      }


      const half =
        26;


      playerX =
        Math.max(
          half,
          Math.min(
            playerX,
            window.innerWidth - half
          )
        );


      playerY =
        Math.max(
          half,
          Math.min(
            playerY,
            window.innerHeight - half
          )
        );


      updatePlayer();

    }


    /* =========================
       ENEMIES
    ========================= */

    let enemies = [];


    function createEnemy() {

      if (!gameRunning) return;


      const enemy =
        document.createElement("div");

      enemy.className = "enemy";


      let side =
        Math.floor(
          Math.random() * 4
        );


      let x;
      let y;


      if (side === 0) {

        x = -40;

        y =
          Math.random() *
          window.innerHeight;

      }


      if (side === 1) {

        x =
          window.innerWidth + 40;

        y =
          Math.random() *
          window.innerHeight;

      }


      if (side === 2) {

        x =
          Math.random() *
          window.innerWidth;

        y = -40;

      }


      if (side === 3) {

        x =
          Math.random() *
          window.innerWidth;

        y =
          window.innerHeight + 40;

      }


      enemy.style.left =
        x + "px";

      enemy.style.top =
        y + "px";


      game.appendChild(enemy);


      enemies.push({

        element: enemy,

        x: x,

        y: y

      });

    }


    /* =========================
       ENEMY MOVEMENT
    ========================= */

    function updateEnemies() {

      if (!gameRunning) return;


      for (
        let i = enemies.length - 1;
        i >= 0;
        i--
      ) {

        const enemy =
          enemies[i];


        const dx =
          playerX -
          enemy.x;

        const dy =
          playerY -
          enemy.y;


        const distance =
          Math.sqrt(
            dx * dx +
            dy * dy
          );


        if (distance > 0) {

          enemy.x +=
            (dx / distance) *
            enemySpeed;

          enemy.y +=
            (dy / distance) *
            enemySpeed;

        }


        enemy.element.style.left =
          enemy.x + "px";

        enemy.element.style.top =
          enemy.y + "px";


        /* COLLISION */

        if (distance < 45) {

          damagePlayer();

          enemy.element.remove();

          enemies.splice(i, 1);

          continue;

        }


        /* REMOVE FAR ENEMIES */

        if (
          enemy.x < -100 ||
          enemy.x >
            window.innerWidth + 100 ||
          enemy.y < -100 ||
          enemy.y >
            window.innerHeight + 100
        ) {

          enemy.element.remove();

          enemies.splice(i, 1);

        }

      }

    }


    /* =========================
       DAMAGE
    ========================= */

    function damagePlayer() {

      health -= 10;


      if (health < 0) {

        health = 0;

      }


      healthDisplay.textContent =
        health;


      player.style.transform =
        "scale(1.2)";


      setTimeout(
        function() {

          player.style.transform =
            "scale(1)";

        },
        120
      );


      if (health <= 0) {

        endGame();

      }

    }


    /* =========================
       SCORE
    ========================= */

    function increaseScore() {

      score += 1;

      scoreDisplay.textContent =
        score;


      if (
        score % 10 === 0 &&
        enemySpeed < 3
      ) {

        enemySpeed += 0.2;

      }

    }


    /* =========================
       PARTICLES
    ========================= */

    function createParticles() {

      for (
        let i = 0;
        i < 35;
        i++
      ) {

        const particle =
          document.createElement("div");

        particle.className =
          "particle";


        particle.style.left =
          Math.random() *
          100 + "%";


        particle.style.top =
          Math.random() *
          100 + "%";


        particle.style.animationDuration =
          (
            4 +
            Math.random() * 7
          ) + "s";


        particle.style.animationDelay =
          Math.random() * 5 + "s";


        game.appendChild(
          particle
        );

      }

    }


    /* =========================
       GAME OVER
    ========================= */

    function endGame() {

      gameRunning = false;

      resetJoystick();

      finalScore.textContent =
        score;

      gameOverScreen.style.display =
        "flex";

    }


    /* =========================
       RESTART
    ========================= */

    restartButton.addEventListener(
      "click",
      function() {

        location.reload();

      }
    );


    /* =========================
       GAME LOOP
    ========================= */

    function gameLoop() {

      movePlayer();

      updateEnemies();

      requestAnimationFrame(
        gameLoop
      );

    }


    /* =========================
       START
    ========================= */

    updatePlayer();

    createParticles();

    gameLoop();


    /* ENEMY SPAWNER */

    setInterval(
      function() {

        if (gameRunning) {

          createEnemy();

        }

      },
      1800
    );


    /* SCORE TIMER */

    setInterval(
      function() {

        if (gameRunning) {

          increaseScore();

        }

      },
      1000
    );


    /* RESIZE */

    window.addEventListener(
      "resize",
      function() {

        playerX =
          Math.min(
            playerX,
            window.innerWidth - 26
          );


        playerY =
          Math.min(
            playerY,
            window.innerHeight - 26
          );


        updatePlayer();

      }
    );

  </script>

</body>
</html>
