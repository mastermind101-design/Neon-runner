<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AURIONS UNLEASHED</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  touch-action: none;
}

body {
  overflow: hidden;
  background: #020817;
  font-family: Arial, sans-serif;
}

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 80%, #064e63 0%, #022c43 35%, #020817 80%);
}

/* Title */
#title {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 4px;
  text-shadow: 0 0 15px #00eaff;
  z-index: 10;
}

/* HUD */
#hud {
  position: absolute;
  top: 65px;
  left: 15px;
  color: white;
  font-size: 16px;
  z-index: 10;
}

#health {
  margin-top: 6px;
}

/* Player */
#player {
  position: absolute;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: radial-gradient(circle, white 5%, #00eaff 35%, #0077ff 70%);
  box-shadow:
    0 0 15px #00eaff,
    0 0 35px #0077ff;
  z-index: 5;
}

/* Enemies */
.enemy {
  position: absolute;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 5%, #ff5c5c 30%, #b00020 75%);
  box-shadow:
    0 0 15px #ff304f,
    0 0 30px #ff0033;
  z-index: 4;
}

/* Joystick */
#joystick {
  position: absolute;
  left: 25px;
  bottom: 30px;
  width: 130px;
  height: 130px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  z-index: 20;
}

#stick {
  position: absolute;
  width: 55px;
  height: 55px;
  left: 37px;
  top: 37px;
  border-radius: 50%;
  background: rgba(0,234,255,0.75);
  box-shadow: 0 0 20px #00eaff;
}

/* Bubbles */
.bubble {
  position: absolute;
  width: 8px;
  height: 8px;
  border: 1px solid rgba(255,255,255,0.5);
  border-radius: 50%;
  animation: rise linear infinite;
}

@keyframes rise {
  from {
    transform: translateY(100vh);
    opacity: 0;
  }
  20% {
    opacity: 1;
  }
  to {
    transform: translateY(-20vh);
    opacity: 0;
  }
}

/* Game over */
#gameOver {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 50;
  color: white;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
}

#gameOver h2 {
  font-size: 38px;
  color: #ff4567;
  text-shadow: 0 0 15px red;
}

#restart {
  margin-top: 20px;
  padding: 12px 25px;
  border: none;
  border-radius: 10px;
  background: #00eaff;
  color: #001018;
  font-weight: bold;
  font-size: 16px;
}
</style>
</head>

<body>

<div id="game">

  <div id="title">AURIONS UNLEASHED</div>

  <div id="hud">
    SCORE: <span id="score">0</span>
    <div id="health">HEALTH: ❤️❤️❤️</div>
  </div>

  <div id="player"></div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="gameOver">
    <h2>GAME OVER</h2>
    <p>Your score: <span id="finalScore">0</span></p>
    <button id="restart">RESTART</button>
  </div>

</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");
const stick = document.getElementById("stick");
const joystick = document.getElementById("joystick");

const scoreText = document.getElementById("score");
const healthText = document.getElementById("health");
const gameOver = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");
const restart = document.getElementById("restart");

let playerX = window.innerWidth / 2 - 21;
let playerY = window.innerHeight / 2 - 21;

let joystickX = 0;
let joystickY = 0;
let joystickActive = false;

let score = 0;
let health = 3;
let gameRunning = true;

let enemies = [];

/* Position player */
function updatePlayer() {
  player.style.left = playerX + "px";
  player.style.top = playerY + "px";
}

/* Move player */
function movePlayer() {

  if (!gameRunning) return;

  playerX += joystickX * 5;
  playerY += joystickY * 5;

  const maxX = window.innerWidth - 42;
  const maxY = window.innerHeight - 42;

  playerX = Math.max(0, Math.min(playerX, maxX));
  playerY = Math.max(0, Math.min(playerY, maxY));

  updatePlayer();
}

/* Joystick */
function moveStick(event) {

  const rect = joystick.getBoundingClientRect();

  let x = event.clientX - (rect.left + rect.width / 2);
  let y = event.clientY - (rect.top + rect.height / 2);

  const distance = Math.sqrt(x*x + y*y);
  const maxDistance = 38;

  if (distance > maxDistance) {
    x = x / distance * maxDistance;
    y = y / distance * maxDistance;
  }

  stick.style.transform = `translate(${x}px, ${y}px)`;

  joystickX = x / maxDistance;
  joystickY = y / maxDistance;
}

joystick.addEventListener("pointerdown", event => {
  joystickActive = true;
  joystick.setPointerCapture(event.pointerId);
  moveStick(event);
});

joystick.addEventListener("pointermove", event => {
  if (joystickActive) {
    moveStick(event);
  }
});

function resetStick() {
  joystickActive = false;
  joystickX = 0;
  joystickY = 0;
  stick.style.transform = "translate(0px, 0px)";
}

joystick.addEventListener("pointerup", resetStick);
joystick.addEventListener("pointercancel", resetStick);

/* Create enemy */
function createEnemy() {

  if (!gameRunning) return;

  const enemy = document.createElement("div");
  enemy.className = "enemy";

  let side = Math.floor(Math.random() * 4);

  let x;
  let y;

  if (side === 0) {
    x = -40;
    y = Math.random() * window.innerHeight;
  }

  if (side === 1) {
    x = window.innerWidth + 40;
    y = Math.random() * window.innerHeight;
  }

  if (side === 2) {
    x = Math.random() * window.innerWidth;
    y = -40;
  }

  if (side === 3) {
    x = Math.random() * window.innerWidth;
    y = window.innerHeight + 40;
  }

  enemy.style.left = x + "px";
  enemy.style.top = y + "px";

  game.appendChild(enemy);

  enemies.push({
    element: enemy,
    x: x,
    y: y,
    speed: 1.2 + Math.random() * 0.8
  });
}

/* Update enemies */
function updateEnemies() {

  if (!gameRunning) return;

  enemies.forEach(enemy => {

    const dx = playerX - enemy.x;
    const dy = playerY - enemy.y;

    const distance = Math.sqrt(dx*dx + dy*dy);

    if (distance > 0) {
      enemy.x += dx / distance * enemy.speed;
      enemy.y += dy / distance * enemy.speed;
    }

    enemy.element.style.left = enemy.x + "px";
    enemy.element.style.top = enemy.y + "px";

    /* Collision */
    if (distance < 45) {
      damagePlayer(enemy);
    }

  });
}

/* Damage player */
function damagePlayer(enemy) {

  health--;

  enemy.x = -100;
  enemy.y = -100;

  healthText.textContent =
    "HEALTH: " + "❤️".repeat(Math.max(0, health));

  if (health <= 0) {
    endGame();
  }
}

/* Score */
function increaseScore() {

  if (!gameRunning) return;

  score++;
  scoreText.textContent = score;
}

/* Game over */
function endGame() {

  gameRunning = false;

  finalScore.textContent = score;
  gameOver.style.display = "flex";

  joystickX = 0;
  joystickY = 0;
}

/* Restart */
restart.addEventListener("click", () => {
  location.reload();
});

/* Bubbles */
function createBubble() {

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  bubble.style.left = Math.random() * 100 + "%";
  bubble.style.animationDuration =
    (4 + Math.random() * 5) + "s";

  game.appendChild(bubble);

  setTimeout(() => {
    bubble.remove();
  }, 9000);
}

/* Game loop */
function gameLoop() {

  movePlayer();
  updateEnemies();

  requestAnimationFrame(gameLoop);
}

/* Start */
updatePlayer();
gameLoop();

/* Enemy spawner */
setInterval(() => {
  createEnemy();
}, 1800);

/* Score timer */
setInterval(() => {
  increaseScore();
}, 1000);

/* Bubbles */
setInterval(() => {
  createBubble();
}, 700);

window.addEventListener("resize", () => {
  playerX = Math.min(playerX, window.innerWidth - 42);
  playerY = Math.min(playerY, window.innerHeight - 42);
  updatePlayer();
});

</script>

</body>
</html>
